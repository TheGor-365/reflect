name: Reflect Vite foundation CI (locked npm ci)
on:
  push:
    branches: ["work/reflect-vite-foundation-2026-11-04"]
    paths:
      - "src/**"
      - "package*.json"
      - ".github/workflows/reflect-auth-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "package*.json"
      - ".github/workflows/reflect-auth-ci.yml"

permissions:
  contents: read

jobs:
  tests-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      VITE_FIREBASE_CONFIG: '{"apiKey":"test-only-key","authDomain":"demo-reflect-auth.firebaseapp.com","projectId":"demo-reflect-auth","appId":"1:123:web:demo"}'
      VITE_APP_ID: "reflect-8fdc8"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Test auth, profile, Firestore state behavior
        run: npm test
      - name: Production-mode build without deployment
        run: npm run build
