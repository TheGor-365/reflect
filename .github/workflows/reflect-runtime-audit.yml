name: Reflect complete dependency security audit

on:
  push:
    branches: ["work/reflect-dependency-security-2026-11-05"]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/reflect-runtime-audit.yml"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/reflect-runtime-audit.yml"

permissions:
  contents: read

jobs:
  audit-all-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exact locked dependency graph
        run: npm ci --no-audit --no-fund
      - name: Fail on moderate-or-higher advisories in all locked dependencies
        run: npm audit --audit-level=moderate
