name: Reflect local emulator integration
on:
  pull_request:
    paths:
      - "tools/backup/**"
      - "tests/test_reflect_emulator_restore.py"
      - ".github/workflows/reflect-emulator-integration.yml"
  push:
    branches: ["work/reflect-readonly-backup-2026-11-04"]
    paths:
      - "tools/backup/**"
      - "tests/test_reflect_emulator_restore.py"
      - ".github/workflows/reflect-emulator-integration.yml"

permissions:
  contents: read

jobs:
  real-emulator-synthetic-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install test-only dependencies
        run: |
          python -m pip install requests
          npm install --global firebase-tools@15.34.2
      - name: Restore SYNTHETIC Firestore record to local demo emulator
        working-directory: tools/backup/emulator
        run: |
          firebase emulators:exec \
            --project demo-reflect-restore \
            --only firestore \
            "python smoke_restore.py"
      - name: Install pinned rules-test dependencies (demo only)
        working-directory: tools/backup/emulator/security-tests
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Validate SYNTHETIC multi-user Firestore rules
        working-directory: tools/backup/emulator
        run: |
          firebase emulators:exec \
            --project demo-reflect-restore \
            --only firestore \
            "npm run test --prefix security-tests"
