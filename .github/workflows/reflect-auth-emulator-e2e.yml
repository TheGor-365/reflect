name: Reflect Vite isolated Auth browser QA
on:
  pull_request:
    paths:
      - "src/**"
      - "package*.json"
      - "tsconfig.json"
      - "tests/emulator/**"
      - ".github/workflows/reflect-auth-emulator-e2e.yml"
  push:
    branches: ["work/reflect-vite-foundation-2026-11-04", "work/reflect-typescript-foundation-2026-11-04"]
    paths:
      - "src/**"
      - "package*.json"
      - "tsconfig.json"
      - "tests/emulator/**"
      - ".github/workflows/reflect-auth-emulator-e2e.yml"

permissions:
  contents: read

jobs:
  demo-only-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned app and test dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --prefix tests/emulator --no-package-lock --ignore-scripts --no-audit --no-fund
          npm install --global firebase-tools@15.34.2
      - name: Install isolated browser
        working-directory: tests/emulator
        run: npx playwright install --with-deps chromium
      - name: Test real browser and demo Firebase emulators
        working-directory: tests/emulator
        run: |
          firebase emulators:exec \
            --project demo-reflect-auth-qa \
            --only auth,firestore \
            "node playwright-smoke.cjs"

      - name: Verify real Auth + Firestore import after emulator shutdown
        working-directory: tests/emulator
        run: |
          set -euo pipefail
          SNAPSHOT="$(node qa-state.cjs latest)"
          test -f "$SNAPSHOT/firebase-export-metadata.json"
          firebase emulators:exec \
            --project demo-reflect-auth-qa \
            --only auth,firestore \
            --import "$SNAPSHOT" \
            "node restore-smoke.cjs"
