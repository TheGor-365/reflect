name: Reflect R139 isolated transaction emulator
on:
  pull_request:
    paths:
      - 'tests/staging/r139-transactions.emulator.test.js'
      - 'tests/staging/firebase.r139.json'
      - 'tests/staging/firestore.r139.deletion.candidate.rules'
      - 'vitest.r139.config.mjs'
      - 'src/features/Sessions/recommendationDecisions.js'
      - 'server/hosted/firestore.rules'
      - 'server/ai/aiTurnRecovery.cjs'
      - 'server/ai/recommendationProvenance*.cjs'
      - 'server/ai/goalAcceptance*.cjs'
      - 'server/railway/index.cjs'
      - 'server/privacy/provenanceRetention*.cjs'
      - '.github/workflows/reflect-r139-transactions-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transactions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCLOUD_PROJECT: demo-reflect-r139
      REFLECT_R139_EMULATOR: '1'
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19399
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:19381
      VITE_FIREBASE_CONFIG: '{"apiKey":"synthetic-only","projectId":"demo-reflect-r139"}'
      VITE_APP_ID: reflect-8fdc8
      VITE_ENABLE_REFLECT_RAILWAY_AI: 'false'
      VITE_ENABLE_REFLECT_CLOUD_AI: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm install --global firebase-tools@15.34.2
      - name: R139 server regression
        run: node --test server/ai/recommendationProvenance.test.cjs server/ai/recommendationProvenanceKeyring.test.cjs server/ai/aiTurnRecovery.test.cjs server/privacy/provenanceRetention.test.cjs server/privacy/provenanceRetentionScheduler.test.cjs server/ai/goalAcceptanceSource.test.cjs server/ai/goalAcceptanceService.test.cjs server/ai/goalAcceptanceHttp.test.cjs server/ai/goalAcceptanceRuntime.test.cjs server/ai/goalAcceptanceComposition.test.cjs server/ai/goalAcceptanceActivation.test.cjs
      - name: Copy repository hosted rules (not live deployment)
        run: |
          cp server/hosted/firestore.rules tests/staging/firestore.r139.runtime.rules
          cmp server/hosted/firestore.rules tests/staging/firestore.r139.runtime.rules
      - name: Run isolated SDK tests
        run: |
          unset GOOGLE_APPLICATION_CREDENTIALS FIREBASE_CONFIG FIREBASE_TOKEN GOOGLE_CLOUD_PROJECT NODE_PATH
          deps="$(mktemp -d)"
          trap 'rm -rf -- "$deps"' EXIT
          npm install --prefix "$deps" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund firebase-admin@13.4.0
          export NODE_PATH="$deps/node_modules"
          node -e 'if(require("firebase-admin/app").SDK_VERSION !== "13.4.0") throw Error("SDK version mismatch")'
          # Shared demo database and global retention queue: serialize test files.
          # Explicit Promise.all concurrency inside each scenario remains enabled.
          firebase emulators:exec --config tests/staging/firebase.r139.json --project demo-reflect-r139 --only auth,firestore "./node_modules/.bin/vitest run --config vitest.r139.config.mjs && node --test --test-concurrency=1 server/privacy/provenanceRetention.emulator.cjs server/privacy/provenanceRetentionScheduler.emulator.cjs server/ai/goalAcceptanceService.emulator.cjs"

          # Fresh emulator process, candidate rules only; hosted rules remain unchanged.
          cp tests/staging/firestore.r139.deletion.candidate.rules tests/staging/firestore.r139.runtime.rules
          firebase emulators:exec --config tests/staging/firebase.r139.json --project demo-reflect-r139 --only auth,firestore "node --test server/privacy/provenanceRetentionDeletionRules.emulator.cjs"
