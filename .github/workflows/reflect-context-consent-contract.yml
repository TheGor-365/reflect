name: Reflect AI-01G isolated context consent security

on:
  pull_request:
    paths:
      - 'server/privacy/**'
      - 'server/railway/index.cjs'
      - 'server/railway/appCheckReplayGuard.cjs'
      - 'server/railway/appCheckReplayGuard.test.cjs'
      - 'src/features/AISettings/**'
      - 'src/api/contextConsentService.js'
      - 'src/api/contextPreviewService.js'
      - '.env.staging.example'
      - '.github/workflows/reflect-context-consent-contract.yml'

permissions:
  contents: read

jobs:
  consent-deny-by-default:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use supported Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated unit and HTTP Auth/AppCheck contract
        run: node --test server/privacy/contextConsent.test.cjs server/privacy/contextConsentHttp.test.cjs server/privacy/sessionContextPreview.test.cjs server/privacy/contextPreviewQuota.test.cjs server/privacy/contextPreviewHttp.test.cjs server/privacy/contextPreviewSecurityGate.test.cjs server/railway/index.test.cjs server/railway/appCheckReplayGuard.test.cjs
      - name: Assert no historical AI access and separate staging flags
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const server = fs.readFileSync('server/railway/index.cjs', 'utf8');
          const replay = fs.readFileSync('server/railway/appCheckReplayGuard.cjs', 'utf8');
          const provider = fs.readFileSync('server/ai/hostedHandler.cjs', 'utf8');
          const policy = fs.readFileSync('server/ai/policy.cjs', 'utf8');
          const client = fs.readFileSync('src/api/contextConsentService.js', 'utf8');
          const config = fs.readFileSync('src/features/AISettings/AISettings.jsx', 'utf8');
          const http = fs.readFileSync('server/privacy/contextConsentHttp.cjs', 'utf8');
          const privatePreview = fs.readFileSync('server/privacy/sessionContextPreview.cjs', 'utf8');
          const previewHttp = fs.readFileSync('server/privacy/contextPreviewHttp.cjs', 'utf8');
          const previewClient = fs.readFileSync('src/api/contextPreviewService.js', 'utf8');
          if (!server.includes('REFLECT_CONTEXT_CONSENT_API_ENABLED === "yes"') ||
              !server.includes('if (consentEnabled && (!enabled || !valid))') ||
              !server.includes('verifyIdToken(token, true)') ||
              !server.includes('verifyToken(token, { consume: true })') ||
              !server.includes('const replayGuard = createAppCheckReplayGuard({') ||
              !server.includes('const firstUse = await replayGuard.consume(token, result)') ||
              !server.includes('app?.alreadyConsumed !== false') ||
              !replay.includes('db.runTransaction(async tx =>') ||
              !replay.includes('tx.create(record,') ||
              !client.includes('VITE_ENABLE_REFLECT_CONTEXT_CONSENT === "true"') ||
              !http.includes('authorizeAccount(auth)') ||
              !http.includes('parseContextConsentCommand(body, principal)') ||
              !config.includes('<ContextConsentPanel') ||
              provider.includes('contextConsent') ||
              provider.includes('sessionHistory') ||
              // Runtime may load preview ONLY inside the independent OFF-by-default gate.
              !server.includes('if (previewEnabled) {') ||
              !server.includes('const { createSessionContextPreview } = require("../privacy/sessionContextPreview.cjs");') ||
              !server.includes('if (previewRoute && req.url === "/v1/privacy/context-preview")') ||
              provider.includes('sessionContextPreview.cjs') ||
              client.includes('sessionContextPreview.cjs') ||
              !server.includes('REFLECT_CONTEXT_PREVIEW_API_ENABLED === "yes"') ||
              !server.includes('if (previewEnabled && (!enabled || !valid || !consentEnabled))') ||
              !previewClient.includes("VITE_ENABLE_REFLECT_CONTEXT_PREVIEW === 'true'") ||
              !previewHttp.includes('attestation?.alreadyConsumed !== false') ||
              !previewHttp.includes('"cache-control": "no-store, private"') ||
              !privatePreview.includes('providerDispatchAllowed: false') ||
              !privatePreview.includes('consentStore.check(target)') ||
              !policy.includes('body.consent.scope !== "one-message"')) {
            throw Error('AI history grant safety boundary regression');
          }
          console.log('PASS: preview separately gated, signed, no-store, no paid provider integration');
          NODE
