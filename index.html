<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1020" />
    <meta name="description" content="Reflect — личное пространство для дневника, целей и осознанных размышлений." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Reflect · Время для себя</title>
    <script>
      // Apply the saved non-sensitive theme before the first paint.
      try {
        document.documentElement.dataset.reflectTheme =
          localStorage.getItem('reflect-theme') === 'light' ? 'light' : 'dark';
      } catch {
        document.documentElement.dataset.reflectTheme = 'dark';
      }
    </script>
    <style>
      html, body { margin: 0; min-height: 100%; background: #0a1020; color: #ebf3ff; }
      html[data-reflect-theme="light"], html[data-reflect-theme="light"] body {
        background: #f4f7fc; color: #18253a;
      }
      #root { min-height: 100vh; min-height: 100dvh; }
      .reflect-boot {
        box-sizing: border-box; display: grid; min-height: 100vh; min-height: 100dvh;
        place-items: center; padding: 32px 20px; color: #ebf3ff;
        background: radial-gradient(ellipse 60% 35% at 60% 0%, rgba(93,92,205,.19), transparent 75%),
          radial-gradient(ellipse 55% 40% at 10% 80%, rgba(33,155,166,.11), transparent 75%), #0a1020;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      html[data-reflect-theme="light"] .reflect-boot {
        color: #18253a;
        background: radial-gradient(ellipse 58% 39% at 85% 0%, rgba(156,151,246,.15), transparent 75%), #f4f7fc;
      }
      .reflect-boot-content { display: flex; align-items: center; flex-direction: column; text-align: center; gap: 0; }
      .reflect-boot-mark {
        display: grid; place-items: center; width: 72px; height: 72px; border-radius: 24px;
        font-size: 39px; font-weight: 850; color: #0b3440;
        background: linear-gradient(135deg,#a1f5df,#58baca 62%,#7d87ef);
        box-shadow: 0 20px 60px rgba(56,187,204,.17);
      }
      .reflect-boot-wordmark { font-size: 30px; letter-spacing: -.065em; font-weight: 800; margin-top: 18px; }
      .reflect-boot-wordmark span { color: #7de5d5; }
      .reflect-boot-message { margin: 8px 0 21px; color: #9baccc; font-size: 13px; line-height: 1.5; }
      html[data-reflect-theme="light"] .reflect-boot-message { color: #63738d; }
      .reflect-boot-track { width: 176px; height: 4px; border-radius: 10px; overflow: hidden; background: rgba(138,158,205,.20); }
      .reflect-boot-track-bar {
        display: block; width: 46%; height: 100%; border-radius: inherit;
        background: linear-gradient(90deg,#a1f5df,#58baca 62%,#7d87ef);
        animation: reflect-loading 1.6s ease-in-out infinite alternate;
      }
      @keyframes reflect-loading { from { transform: translateX(-100%); } to { transform: translateX(320%); } }
      @media (prefers-reduced-motion: reduce) { .reflect-boot-track-bar { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="reflect-boot" role="status" aria-label="Загружаем Reflect">
        <div class="reflect-boot-content">
          <span class="reflect-boot-mark" aria-hidden="true">R</span>
          <div class="reflect-boot-wordmark" aria-hidden="true">reflect<span>.</span></div>
          <p class="reflect-boot-message">Подготавливаем ваше пространство</p>
          <div class="reflect-boot-track" aria-hidden="true">
            <span class="reflect-boot-track-bar"></span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
