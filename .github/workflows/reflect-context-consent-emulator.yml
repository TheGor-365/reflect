name: Reflect AI-01G synthetic Firebase consent emulator

on:
  pull_request:
    paths:
      - 'server/privacy/**'
      - 'server/hosted/firestore.rules'
      - 'tests/staging/context-consent-emulator.cjs'
      - 'firebase.context-consent-emulator.json'
      - '.github/workflows/reflect-context-consent-emulator.yml'

permissions:
  contents: read

jobs:
  isolated-auth-firestore:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GCLOUD_PROJECT: demo-reflect-context-consent
    steps:
      - name: Checkout exact PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated Admin SDK and pinned Firebase CLI
        run: |
          npm install --prefix server --no-package-lock --ignore-scripts --no-audit --no-fund
          npm install --global firebase-tools@15.34.2
      - name: Verify browser-private deny and Admin grant-revoke using synthetic Auth
        run: |
          firebase emulators:exec \
            --config firebase.context-consent-emulator.json \
            --project demo-reflect-context-consent \
            --only auth,firestore \
            "node tests/staging/context-consent-emulator.cjs"
