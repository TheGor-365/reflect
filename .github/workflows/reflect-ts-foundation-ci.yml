name: Reflect TypeScript 01B (locked compiler)
on:
  push:
    branches: ["work/reflect-typescript-foundation-2026-11-04"]
    paths:
      - "src/**"
      - "tsconfig.json"
      - "package*.json"
      - ".github/workflows/reflect-ts-foundation-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tsconfig.json"
      - "package*.json"
      - ".github/workflows/reflect-ts-foundation-ci.yml"

permissions:
  contents: read

jobs:
  typecheck-tests-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      VITE_FIREBASE_CONFIG: '{"apiKey":"demo-only","authDomain":"demo-reflect-auth-qa.firebaseapp.com","projectId":"demo-reflect-auth-qa","appId":"1:123:web:demo"}'
      VITE_APP_ID: "reflect-8fdc8"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund
      - name: Strict TypeScript check from locked dependencies
        run: npm run typecheck
      - name: Run all regression tests
        run: npm test
      - name: Build Vite application without deployment
        run: npm run build
