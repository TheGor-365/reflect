name: Reflect Railway R1 exact-head staging candidate (no deploy)
on:
  pull_request:
    paths:
      - 'server/ai/**'
      - 'docs/release/REFLECT_RAILWAY_R1_STAGING_GATE_2026-11-17.md'
      - '.github/workflows/reflect-railway-r1-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-exact-R1-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_FIREBASE_CONFIG: '{"apiKey":"demo-only-key","authDomain":"demo-reflect-auth-qa.firebaseapp.com","projectId":"demo-reflect-auth-qa","appId":"1:12345:web:demo"}'
      VITE_APP_ID: reflect-8fdc8
      VITE_USE_FIREBASE_EMULATORS: 'true'
      VITE_ENABLE_REFLECT_CLOUD_AI: 'false'
      VITE_ENABLE_REFLECT_RAILWAY_AI: 'false'
      REFLECT_AI_ENABLED: 'no'
      REFLECT_XAI_OUTBOUND_ENABLED: 'no'
      REFLECT_XAI_FIXTURES_ONLY: 'yes'
    steps:
      - name: Checkout exact release PR HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert immutable HEAD, live-M5c parent and change boundary
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          BASE=5bce3da02c08f1d5b78ed173302ee9c1957baadd
          git cat-file -e "${BASE}^{commit}"
          git merge-base --is-ancestor "$BASE" "$ACTUAL_SHA"
          git diff --name-only "$BASE" "$ACTUAL_SHA" | sort > /tmp/actual-paths
          cat > /tmp/expected-paths <<'EOF'
          .github/workflows/reflect-railway-r1-candidate.yml
          docs/release/REFLECT_RAILWAY_R1_STAGING_GATE_2026-11-17.md
          server/ai/interactionContract.cjs
          server/ai/interactionContract.test.cjs
          server/ai/interactionEvidenceV2.test.cjs
          EOF
          diff -u /tmp/expected-paths /tmp/actual-paths
          echo "PASS exact Railway R1 release HEAD: $ACTUAL_SHA (no deploy)"
      - name: Syntax and offline server v1 v2 safety contracts
        run: |
          node --check server/ai/interactionContract.cjs
          node --check server/railway/index.cjs
          node --test server/ai/interactionContract.test.cjs server/ai/interactionEvidenceV2.test.cjs server/ai/interactionProvider.test.cjs server/railway/index.test.cjs
      - name: Static budget and no-provider safety guard
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const src=fs.readFileSync('server/ai/interactionContract.cjs','utf8');
          if (!src.includes('ОБЯЗАТЕЛЬНО: обращайся к человеку во втором лице') ||
              !src.includes('Не обрывай слово') ||
              !src.includes('желательно не более 180 символов') ||
              !src.includes('желательно не более 850 символов') ||
              !src.includes('store: false') ||
              !src.includes('MAX_STRUCTURED_OUTPUT_TOKENS')) {
            throw Error('R1 prompt or model budget invariant broken');
          }
          for (const forbidden of ['process.env.XAI_API_KEY','globalThis.fetch(','console.log(']) {
            if (src.includes(forbidden)) throw Error('Unsafe direct provider path in prompt module');
          }
          console.log('PASS: no direct provider path; request caps are asserted by tests');
          NODE
      - name: Synthetic frontend regression and typecheck
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck
          npm run build
      - name: Release declaration
        run: |
          echo 'Railway R1 verified at exact HEAD with synthetic keys only.'
          echo 'No xAI traffic, no Railway deployment, no source switch.'
